version: 2
project_name: dtiam

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./cmd/dtiam
    binary: dtiam
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/timstewart-dynatrace/dtiam/v3/pkg/version.Version={{.Version}}
      - -X github.com/timstewart-dynatrace/dtiam/v3/pkg/version.Commit={{.Commit}}
      - -X github.com/timstewart-dynatrace/dtiam/v3/pkg/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  # Names must match what install.sh / install.ps1 download:
  #   dtiam_{version}_{os}_{arch}.tar.gz  (lowercase os, amd64/arm64)
  # Windows is tar.gz too: install.ps1 extracts with the tar.exe that ships
  # with Windows 10 1803+. The binary sits at the archive root.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: timstewart-dynatrace
    name: dtiam
  draft: true
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

nfpms:
  - id: packages
    package_name: dtiam
    vendor: timstewart-dynatrace
    homepage: https://github.com/timstewart-dynatrace/dtiam
    maintainer: Timothy Stewart
    description: A kubectl-style CLI for Dynatrace IAM
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
